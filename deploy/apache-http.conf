# Apache do cPanel (HTTP, porta 80): manda tudo para HTTPS, menos a validacao do certificado (AutoSSL).
# Vai para /etc/apache2/conf.d/userdata/std/2_4/USUARIO/DOMINIO/smpe.conf (o instalar.sh copia).
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
