# Apache do cPanel (HTTPS): entrega o dominio ao SIS SMPE, que roda em 127.0.0.1:8010.
# Vai para /etc/apache2/conf.d/userdata/ssl/2_4/USUARIO/DOMINIO/smpe.conf (o instalar.sh copia).
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 600
LimitRequestBody 209715200
RequestHeader set X-Forwarded-Proto "https"
# a validacao do certificado (AutoSSL) continua sendo servida pelo proprio Apache
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:8010/ retry=0
ProxyPassReverse / http://127.0.0.1:8010/
