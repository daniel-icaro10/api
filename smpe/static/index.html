<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIS SMPE</title>
<link rel="icon" href="/static/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-painel" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></symbol>
  <symbol id="i-migracao" viewBox="0 0 24 24"><path d="M16 3l4 4-4 4"/><path d="M20 7H8"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h12"/></symbol>
  <symbol id="i-escolas" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M10 21v-5h4v5"/></symbol>
  <symbol id="i-remessas" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></symbol>
  <symbol id="i-relatorios" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></symbol>
  <symbol id="i-orcamento" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/></symbol>
  <symbol id="i-bases" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-critica" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-config" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-suporte" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M3 21l1.7-4.9A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1a4 4 0 0 1-2-2l1-1-1-2z"/></symbol>
  <symbol id="i-sair" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
</svg>
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <img class="logo-img" src="/api/logo" alt="SIS SMPE - Migração de estudantes SMTT">
    <h1 id="loginTitulo">Entrar</h1>
    <p class="muted" id="loginSub">Acesse com o login da sua instituição.</p>
    <div class="alert warn" id="loginMsg" hidden></div>
    <div><label>Login</label><input name="login" autocomplete="username" required></div>
    <div><label>Senha</label><input name="senha" type="password" autocomplete="current-password" required></div>
    <div id="loginConf" hidden><label>Confirme a senha</label><input name="senha2" type="password" autocomplete="new-password"></div>
    <button class="primary" id="loginBtn">Entrar</button>
    <div class="login-sup" id="loginSup"></div>
  </form>
</div>
<aside class="side">
  <div class="brand"><img class="logo-img" src="/api/logo" alt="SIS SMPE - Migração de estudantes SMTT"></div>
  <nav id="nav">
    <div class="nav-label">Visão geral</div>
    <a href="#/painel" data-r="painel"><svg class="i"><use href="#i-painel"/></svg>Painel</a>
    <div class="nav-label">Operação</div>
    <a href="#/migracao" data-r="migracao"><svg class="i"><use href="#i-migracao"/></svg>Matriculado</a>
    <a href="#/remessas" data-r="remessas"><svg class="i"><use href="#i-remessas"/></svg>Remessas SMTT</a>
    <a href="#/critica" data-r="critica"><svg class="i"><use href="#i-critica"/></svg>Criticar remessa</a>
    <a href="#/relatorios" data-r="relatorios"><svg class="i"><use href="#i-relatorios"/></svg>Relatórios</a>
    <a href="#/orcamento" data-r="orcamento" data-admin><svg class="i"><use href="#i-orcamento"/></svg>Orçamento</a>
    <div class="nav-label" data-admin>Cadastros</div>
    <a href="#/escolas" data-r="escolas" data-admin><svg class="i"><use href="#i-escolas"/></svg>Instituições</a>
    <a href="#/bases" data-r="bases" data-admin><svg class="i"><use href="#i-bases"/></svg>Bases e importação</a>
    <a href="#/config" data-r="config" data-admin><svg class="i"><use href="#i-config"/></svg>Configurações</a>
  </nav>
  <div class="side-sup">
    <a href="#" id="supBtn"><svg class="i"><use href="#i-suporte"/></svg>Suporte</a>
    <a href="#" id="waBtn" class="wa" target="_blank" rel="noopener" hidden><svg class="i"><use href="#i-whatsapp"/></svg>Suporte via WhatsApp</a>
  </div>
  <div class="side-foot"><span class="dot"></span>Uso restrito (LGPD)</div>
</aside>
<div class="main">
  <header class="top">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
    <div><h1 id="title">Painel</h1><div class="crumb" id="crumb">SIS SMPE</div></div>
    <form class="search" id="buscaForm"><svg class="i"><use href="#i-busca"/></svg><input id="buscaInput" placeholder="Localizar estudante por nome ou CPF…" autocomplete="off"></form>
    <div class="user" id="userBox">
      <button class="user-btn" id="userBtn" aria-haspopup="true"><span class="user-av" id="userAv"></span>
        <span class="user-txt"><b id="userNome"></b><small id="userPerfil"></small></span></button>
      <div class="user-menu" id="userMenu" hidden>
        <button id="senhaBtn">Alterar senha</button>
        <button id="sairBtn" class="danger"><svg class="i"><use href="#i-sair"/></svg>Sair</button>
      </div>
    </div>
  </header>
  <section id="view" class="view"></section>
</div>

<div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-panel" id="drawerPanel"></div></div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
